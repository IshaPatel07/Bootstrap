<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Final project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Header -->
    
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <span class="text-dark fs-1 fw-bold">osty.</span>
          <header class="d-flex justify-content-center py-3">
          <ul class="nav nav-pills">
            <li class="nav-item">
              <a href="#" class="nav-link text-black  fs-4">home</a>
            </li>
            <li class="nav-item"><a href="#" class="nav-link text-black fs-4 ">Features</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-black  fs-4">Pricing</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-black fs-4">FAQs</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-black fs-4">About</a></li>
          </ul>
        </header>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container-fluid bg-light py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <h1 class="display-4 fw-bold">A place to display you <br> masterpiece</h1>
        </div>
        <div class="row  justify-content-center mt-4">
          <div class="col-md-2 d-flex justify-content-center m-3">
            <img class=" col-10" src="https://theme.madsparrow.me/osty/wp-content/uploads/2025/02/Three-Scoops-of-Ice-Cream-on-Spoons.webp" alt="">
            <img class=" col-10 " src="https://theme.madsparrow.me/osty/wp-content/uploads/2025/01/Green-Character-in-Yellow-Hoodie-m_f.png" alt="">
            <img src="https://theme.madsparrow.me/osty/wp-content/uploads/2025/01/Whimsical-Character-in-a-Jar-m_f.png" alt="" class="col-10 ">

          </div>
          <div class="row  justify-content-center mt-4">
             <span class="col-md-6 text-center fs-4">
              Artists can display their masterpieces, and buyers can discover  and purchase works that resonate with them.
            </span>
          </div>
          <div class="row  justify-content-center mt-4">
            <div class="col-5 d-flex justify-content-center gap-3">
              <button type="button" class="btn btn-dark btn-lg">Contact Me</button>
            <button type="button" class="btn btn-light btn-lg">Discover our Work</button>
            </div>
          </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
